function excelDateKey(v){if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}const t=String(v??'').trim();const m=t.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:''}
function sheetContainsDate(ws,date){if(!ws)return false;for(let c=0;c<80;c++){const cell=ws[XLSX.utils.encode_cell({r:1,c})];if(cell&&excelDateKey(cell.v)===date)return true}return false}
function findInventoryColumn(ws,date){for(let c=0;c<100;c++){const h=ws[XLSX.utils.encode_cell({r:2,c})]?.v;if(String(h??'').replace(/\s/g,'').includes('盤點庫存')){for(let x=Math.max(0,c-3);x<=c;x++){const v=ws[XLSX.utils.encode_cell({r:1,c:x})]?.v;if(excelDateKey(v)===date)return c}}}return -1}
function collectSummaryValues(){normalizeCentralMasterNames();const d=$('summaryDate').value,order=['cold','pizza','s2','s1'];return Promise.all(order.map(async s=>{let saved=null;try{const snap=await db.collection('dailyInventory').doc(KitchenStore.cloudId(`central-${s}-${d}`)).get();if(snap.exists)saved=snap.data()}catch(e){saved=JSON.parse(localStorage.getItem(stationKey(s,d))||'null')}return centralData[s].map((r,i)=>{const row=savedCentralRow(saved,r,i),a=parseFloat(row?.a),b=parseFloat(row?.b);return {no:r[5],name:r[0],value:(Number.isFinite(a)||Number.isFinite(b))?(Number.isFinite(a)?a:0)+(Number.isFinite(b)?b:0):null,station:names[s]}})})).then(x=>x.flat())}
async function buildExportPlan(){if(!orderWorkbook)throw new Error('請先上傳叫貨表 Excel');const sheetName=decodeURIComponent($('orderSheet').value),ws=orderWorkbook.Sheets[sheetName],date=$('summaryDate').value,col=findInventoryColumn(ws,date);if(col<0)throw new Error(`在「${sheetName}」找不到 ${date} 對應的盤點庫存欄`);const values=await collectSummaryValues(),byNo=new Map(values.map(x=>[Number(x.no),x])),matches=[],missingRows=[],unfilled=[];const range=XLSX.utils.decode_range(ws['!ref']||'A1:A1');for(let r=3;r<=range.e.r;r++){const no=Number(ws[XLSX.utils.encode_cell({r,c:0})]?.v);if(!Number.isFinite(no)||!byNo.has(no))continue;const item=byNo.get(no);matches.push({row:r,col,item});if(item.value===null)unfilled.push(`${item.station}｜${item.no}. ${item.name}`)}for(const item of values)if(!matches.some(m=>m.item.no===item.no))missingRows.push(`${item.no}. ${item.name}`);return {sheetName,ws,date,col,matches,missingRows,unfilled}}
async function previewOrderExport(){if(!orderWorkbook)return;try{const p=await buildExportPlan(),letter=XLSX.utils.encode_col(p.col);$('exportStatus').className='export-status '+(p.unfilled.length||p.missingRows.length?'bad':'ok');$('exportStatus').innerHTML=`工作表：<b>${p.sheetName}</b><br>日期：<b>${p.date}</b>｜寫入欄：<b>${letter}（盤點庫存）</b><br>找到 ${p.matches.length}／103 項；尚未盤點 ${p.unfilled.length} 項；Excel 找不到 ${p.missingRows.length} 項。` }catch(e){$('exportStatus').className='export-status bad';$('exportStatus').textContent=e.message}}
async function exportOrderWorkbook(){try{const p=await buildExportPlan();if(p.unfilled.length){const msg=`仍有 ${p.unfilled.length} 項尚未盤點：\n${p.unfilled.slice(0,8).join('\n')}${p.unfilled.length>8?'\n…':''}\n\n尚未盤點的格子會保持空白，仍要下載嗎？`;if(!confirm(msg))return}if(p.missingRows.length&&!confirm(`Excel 中有 ${p.missingRows.length} 個品項找不到對應列，仍要下載嗎？`))return;for(const m of p.matches){const addr=XLSX.utils.encode_cell({r:m.row,c:p.col});if(m.item.value===null){delete p.ws[addr]}else{const old=p.ws[addr]||{};p.ws[addr]={...old,t:'n',v:Number(m.item.value)};delete p.ws[addr].f;delete p.ws[addr].w}}const base=orderFilename.replace(/\.(xlsx|xls)$/i,''),stamp=p.date.replace(/-/g,'');XLSX.writeFile(orderWorkbook,`${base}-${stamp}盤點已填.xlsx`,{bookType:'xlsx',cellStyles:true});$('exportStatus').className='export-status ok';$('exportStatus').textContent=`已產生 ${p.sheetName}｜${p.date} 的叫貨表。請先打開確認公式與格式。`}catch(e){console.error(e);alert(e.message||'匯出失敗')}}

function normalizeCentralMasterNames(){
  Object.values(centralData).flat().forEach(r=>{

// 三家店的肋眼顯示名稱不完全相同（例如「修清肋眼／公斤」或
// 「肋眼牛排 454G／塊」），只要是 S1 肋眼都統一用盤包輸入，

function isRibeyePackItem(r){return station==='s1'&&/肋眼/.test(String(r?.[0]||''))}
function isPaperTowelItem(r){return station==='s1'&&/紙抹布/.test(String(r?.[0]||''))}
function conversionConfig(r){
  const name=r[0]||'', no=Number(r[5]);
  if(station==='s2'&&(no===59||/紅蝦高湯/.test(name)))return {mode:'shrimp',aFactor:1,bFactor:2/3,aLabel:'今日儲位（BAG）',bLabel:'今日站上（蝦醬／桶）',totalLabel:'今日總計（BAG）',note:'今日站上每 3 桶蝦醬換算為 2 BAG 紅蝦高湯；總計統一以 BAG 計算。',stepA:'0.01',stepB:'0.01'};
  if(station==='pizza'&&(no===34||/義式絞肉/.test(name)))return {mode:'italian',aFactor:1,bFactor:0.5,aLabel:'今日儲位（包）',bLabel:'今日站上（盒）',totalLabel:'今日總計（包）',note:'今日站上每 2 盒義式絞肉換算為 1 包；總計統一以包計算。',stepA:'0.01',stepB:'0.01'};
  if(station==='pizza'&&(no===32||/培根/.test(name)))return {mode:'bacon',sourceUnit:'KG',calcUnit:'KG',aFactor:0.7,bFactor:0.7,aLabel:'今日儲位（包）',bLabel:'今日站上（包）',totalLabel:'今日總計（KG）',note:'昨日盤點、今日到貨、盤點前應有皆以 KG 計算；今日儲位與站上以包數輸入，每包自動換算 0.7 KG。',stepA:'0.01',stepB:'0.01'};
  if(isRibeyePackItem(r))return {mode:'ribeye',aFactor:0.47,bFactor:0.47,aLabel:'今日儲位（包）',bLabel:'今日站上（包）',totalLabel:'今日總計（KG）',note:'輸入包數後，系統自動以「包數 × 0.47 KG」換算；主管總表及叫貨表會帶入 KG。',stepA:'0.01',stepB:'0.01'};
  if(isPaperTowelItem(r))return {mode:'paper-towel',aFactor:0.1,bFactor:0,aLabel:'未使用庫存（卷）',bLabel:'使用中（不計）',totalLabel:'今日總計（包）',note:'只盤未使用的完整卷數；使用中的紙抹布不計。系統以「卷數 ÷ 10」換算成包。',stepA:'0.01',stepB:'0.01',bDisabled:true};
  return null;
}
function keepTwoDecimals(el){
  let v=String(el.value??'').replace(/,/g,'.').replace(/[^\d.]/g,'');
  const first=v.indexOf('.');
  if(first>=0){
    v=v.slice(0,first+1)+v.slice(first+1).replace(/\./g,'');
    const parts=v.split('.');
    v=parts[0]+'.'+(parts[1]||'').slice(0,2);
  }
  el.value=v;
}
function centralCard(r,i){const [name,unit,storage,yesterday,delivery,no]=r,missing=yesterday===null,cfg=conversionConfig(r),expected=missing?'—':fmt(yesterday+delivery);if(cfg){const sourceUnit=cfg.sourceUnit||unit;return `<article class="item ${missing?'warn':''}" data-i="${i}" data-mode="${cfg.mode}" data-afactor="${cfg.aFactor}" data-bfactor="${cfg.bFactor}" data-calcunit="${cfg.calcUnit||unit}"><h3>${no}. ${name}</h3><div class="sub">儲位：${storage}　換算盤點</div><div class="source-row"><div class="source-box">${previousLabel} 昨日盤點<b class="${missing?'missing':''}">${missing?'未提供':fmt(yesterday)} ${sourceUnit}</b></div><div class="source-box">${deliveryLabel} 今日到貨<b>${fmt(delivery)} ${sourceUnit}</b></div><div class="source-box">盤點前應有<b>${expected}${expected==='—'?'':' '+sourceUnit}</b></div></div><div class="validation-grid"><div class="field"><label>${cfg.aLabel}<input inputmode="decimal" class="a" type="text" autocomplete="off" oninput="keepTwoDecimals(this);calcCentral(${i})"></label></div><div class="field"><label>${cfg.bLabel}<input inputmode="decimal" class="b" type="text" autocomplete="off" ${cfg.bDisabled?'disabled value="0"':''} oninput="keepTwoDecimals(this);calcCentral(${i})"></label></div><div class="field"><label>${cfg.totalLabel}<input class="sum" readonly tabindex="-1"></label></div></div><div class="conversion-note">${cfg.note}</div><div class="usage"><span class="used">推算使用量：—</span><span class="status">${missing?'⚠ 昨日數據缺漏':'待輸入'}</span></div></article>`;}return `<article class="item ${missing?'warn':''}" data-i="${i}"><h3>${no}. ${name}</h3><div class="sub">儲位：${storage}　單位：${unit}</div><div class="source-row"><div class="source-box">${previousLabel} 昨日盤點<b class="${missing?'missing':''}">${missing?'未提供':fmt(yesterday)}</b></div><div class="source-box">${deliveryLabel} 今日到貨<b>${fmt(delivery)}</b></div><div class="source-box">盤點前應有<b>${expected}</b></div></div><div class="validation-grid"><div class="field"><label>今日儲位<input inputmode="decimal" clas function prepCard(r,i){if(station==='s2'&&hiddenPrepItems.has(r[0]))return `<article class="item" data-i="${i}" hidden><input class="actual" type="hidden"></article>`;return `<article class="item" data-i="${i}"><h3>${r[0]}</h3><div class="sub">盤點單位：${r[1]||'—'}　效期：${r[2]||'—'}</div><div class="cols"><div class="field"><label>目前站上庫存（${r[1]||'單位'}）<input inputmode="decimal" class="actual" type="number" min="0" step="any" placeholder="0" oninput="calcPrep(${i})"></label></div></div><div class="total"><span>可輸入小數，例如 2.5</span><span class="status">待輸入</span></div></article>`}

function calcCentral(i){const c=document.querySelector(`[data-i="${i}"]`),r=centralData[station][i],aFactor=Number(c.dataset.afactor||1),bFactor=Number(c.dataset.bfactor||1),av=c.querySelector('.a').value,bv=c.querySelector('.b').value;const a=Math.round(n(c.querySelector('.a'))*aFactor*100)/100,b=Math.round(n(c.querySelector('.b'))*bFactor*100)/100,total=Math.round((a+b)*100)/100;c.querySelector('.sum').value=(av===''&&bv==='')?'':fmt(total);const yesterday=r[3],delivery=r[4];if(av===''&&bv===''){c.querySelector('.used').textContent='推算使用量：—';c.querySelector('.status').textContent=yesterday===null?'⚠ 昨日數據缺漏':'待輸入';c.classList.toggle('warn',yesterday===null);return}if(yesterday===null){c.querySelector('.used').textContent='推算使用量：無法計算';c.querySelector('.status').textContent='⚠ 昨日數據缺漏';c.classList.add('warn');return}const used=yesterday+delivery-total;const calcUnit=c.dataset.calcunit||r[1];c.querySelector('.used').textContent=`推算使用量：${fmt(used)} ${calcUnit}`;const abnormal=used<0;c.classList.toggle('warn',abnormal);c.querySelector('.status').textContent=abnormal?'⚠ 庫存高於應有':'✓ 已驗證'}

function centralRowId(row){if(!row)return '';const code=String(row[6]||'').trim();if(code)return 'code:'+code;return 'name:'+String(row[0]||'').normalize('NFKC').toLowerCase().replace(/[\s　]/g,'')}
function savedCentralRow(saved,row,index){const rows=saved?.rows||[],id=centralRowId(row);const exact=rows.find(x=>x&&x.itemId===id);if(exact)return exact;const byName=rows.find(x=>x&&x.itemName&&String(x.itemName).normalize('NFKC')===String(row?.[0]||'').normalize('NFKC'));if(byName)return byName;return rows[index]||{}}
function collectPayload(){const rows=[...document.querySelectorAll('.item')].map((c,i)=>{if(formType!=='central')return {name:prepData[station]?.[i]?.[0]||'',actual:c.querySelector('.actual').value};const master=centralData[station]?.[i],rawA=c.querySelector('.a').value,rawB=c.querySelector('.b').value,aFactor=Number(c.dataset.afactor||1),bFactor=Number(c.dataset.bfactor||1),mode=c.dataset.mode||'';const a=rawA===''?'':Math.round(Number(rawA)*aFactor*100)/100,b=rawB===''?'':Math.round(Number(rawB)*bFactor*100)/100;return {itemId:centralRowId(master),itemName:master?.[0]||'',productCode:String(master?.[6]||''),a,b,rawA,rawB,aFactor,bFactor,mode}});return {person:$('person').value,rows,date:$('date').value,station,formType,storeId:KitchenStore.current.id,rowSchemaVersion:2,updatedAtLocal:new Date().toISOString()}}
function applyLiveData(x){applyingRemote=true;$('person').value=x?.person||'';[...document.querySelectorAll('.item')].forEach((c,i)=>{const r=formType==='central'?savedCentralRow(x,centralData[station]?.[i],i):(x?.rows?.[i]||{});if(formType==='central'){const aFactor=Number(c.dataset.afactor||1),bFactor=Number(c.dataset.bfactor||1);c.querySelector('.a').value=r.rawA??r.aPacks??(r.a!==''&&r.a!=null?fmt(Number(r.a)/aFactor):'');c.querySelector('.b').value=r.rawB??r.bPacks??(r.b!==''&&r.b!=null?fmt(Number(r.b)/bFactor):'');calcCentral(i)}else{c.querySelector('.actual').value=r.actual??'';calcPrep(i)}});applyingRemote=false}
function liveRef(){return db.collection('dailyInventory').doc(KitchenStore.cloudId(`${formType}-${station}-${$('date').value}`))}
function stopLiveSync(){if(liveUnsubscribe){liveUnsubscribe();liveUnsubscribe=null}clearTimeout(autoSaveTimer)}
function startLiveSync(){stopLiveSync();let cached=null,receivedFirstSnapshot=false;try{cached=JSON.parse(localStorage.getItem(key())||'null')}catch(e){}if(cached)applyLiveData(cached);liveUnsubscribe=liveRef().onSnapshot({includeMetadataChanges:true},snap=>{if(snap.metadata.hasPendingWrites)return;if(!snap.exists){if(!receivedFirstSnapshot&&cached){receivedFirstSnapshot=true;persistLive(false);return}receivedFirstSnapshot=true;localStorage.removeItem(key());applyLiveData(null);return}receivedFirstSnapshot=true;const x=snap.data();localStorage.setItem(key(),JSON.stringify(x));applyLiveData(x);$('hint').dataset.live='1'},e=>console.warn('即時同步暫停，使用本機快取',e))}
async function persistLive(showMessage=false){if(!station)return;const payload=collectPayload();localStorage.setItem(key(),JSON.stringify(payload));try{await liveRef().set({...payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});if(showMessage)alert(formType==='central'?'已同步至雲端，其他手機會自動更新':'站上庫存已同步，其他手機與 Weekly 會自動更新')}catch(e){console.error(e);if(showMessage)alert('目前離線，資料已先保存在這支裝置；網路恢復後會繼續同步')}}
function scheduleAutoSave(){if(applyingRemote||!station)return;clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(()=>persistLive(false),500)}
async function saveAll(){clearTimeout(autoSaveTimer);await persistLive(true)}
async function load(){startLiveSync()}
async function clearToday(){if(!confirm('確定清除這一天的盤點資料？所有裝置都會一起清除。'))return;stopLiveSync();localStorage.removeItem(key());try{await liveRef().delete()}catch(e){console.error(e);alert('雲端清除失敗，請稍後再試');startLiveSync();return}$('person').value='';render();startLiveSync();alert('已清除雲端盤點資料')}
$('formPanel').addEventListener('input',scheduleAutoSave);
$('date').addEventListener('change',async()=>{if(station){stopLiveSync();const d=$('date').value;if(formType==='central'){preloadDailyContextLocal(d);render();$('hint').textContent='先顯示本機快取，正在背景更新資料…';await loadDailyContext(d)}$('hint').textContent=formType==='central'?`✓ 已更新 ${previousLabel} 昨日盤點與 ${deliveryLabel} 今日到貨。若昨日無資料，系統不會改抓更早日期。`:'請依畫面單位輸入目前站上實際庫存，可輸入小數（例如 2.5 盒）。儲存後 Weekly 會依規格換算原物料。';render();load()}});
