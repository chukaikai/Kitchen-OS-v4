<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173f35" />
    <title>Kitchen OS v4.1｜Weekly</title>
    <link rel="stylesheet" href="weekly-v4/styles.css?v=20260807-total-front-v1" />
    <script src="store-context.js?v=20260805-multistore-v1"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="weekly-v4/app.js?v=20260807-total-front-v1" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="header-title">
          <a class="home-link" href="index.html" aria-label="返回 Kitchen OS 首頁">‹ 首頁</a>
          <div>
            <p class="eyebrow">KITCHEN OS v4.1</p>
            <h1>Weekly 周盤</h1>
          </div>
        </div>
        <div class="save-state" id="saveState" role="status" aria-live="polite">已載入</div>
      </div>
    </header>

    <main class="page-shell">
      <nav class="station-tabs" aria-label="工作站切換">
        <button class="station-tab active" type="button" data-station="cold">Cold</button>
        <button class="station-tab" type="button" data-station="s1">S1</button>
        <button class="station-tab" type="button" data-station="s2">S2</button>
        <button class="station-tab" type="button" data-station="pizza">Pizza</button>
        <button class="station-tab summary-tab" type="button" data-station="summary">整店總表</button>
      </nav>

      <section class="toolbar" aria-label="盤點工具">
        <label class="search-box" for="searchInput">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜尋品項或單位" autocomplete="off" />
        </label>
        <p class="item-count" id="itemCount"></p>
      </section>
      <section class="prep-sync" aria-label="備料盤點同步">
        <div>
          <strong>站上數量來自站上備料盤點</strong>
          <p id="prepSyncMessage">選擇日期後，系統會抓取人員盤點的站上庫存，依規格換算成原物料。</p>
        </div>
        <label>盤點日期
          <input id="inventoryDate" type="date" />
        </label>
        <button id="loadPrepButton" type="button">抓取並換算站上庫存</button>
      </section>

      <section class="table-card" id="inventorySection" aria-label="Cold 週盤點">
        <div class="table-scroll">
          <table>
            <thead>
              <tr id="inventoryHeadRow">
                <th scope="col">品項</th>
                <th scope="col">單位</th>
                <th scope="col">儲位</th>
                <th scope="col">站上</th>
                <th scope="col">TOTAL</th>
              </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
          </table>
        </div>
        <div class="empty-state" id="emptyState" hidden>找不到符合的品項</div>
      </section>

      <p class="storage-note">輸入後會自動儲存在此裝置。</p>
    </main>
  </body>
</html>
