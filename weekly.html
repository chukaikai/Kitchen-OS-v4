<!doctype html>
<html lang="zh-Hant">
  <head>

    <title>Kitchen OS v4.1｜Weekly</title>
    <style>
:root {
  color-scheme: light;
  --forest-900: #173f35;
  --forest-700: #286052;
  --forest-100: #e8f1ed;
  --ink: #202522;
  --muted: #6a746f;
  --line: #dfe5e1;
  --surface: #ffffff;
  --background: #f4f6f4;
  --total: #edf6f1;
  --focus: #2a8068;
  font-family:
    -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei",
    "Noto Sans TC", sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  min-width: 320px;
  margin: 0;
  color: var(--ink);
  background: var(--background);
}

button,
input {
  font: inherit;
}

.app-header {
  color: #fff;
  background: var(--forest-900);
  box-shadow: 0 2px 10px rgb(23 63 53 / 18%);
}

.header-inner,
.page-shell {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
}

.header-inner {
  min-height: 112px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.header-title {
  display: flex;
  align-items: center;
  gap: 18px;
}

.home-link {
  flex: 0 0 auto;
  padding: 9px 12px;
  border: 1px solid rgb(255 255 255 / 24%);
  border-radius: 10px;
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
}

.home-link:hover,
.home-link:focus-visible {
  background: rgb(255 255 255 / 10%);
}

.eyebrow {
  margin: 0 0 4px;
  color: #bcd4ca;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.16em;
}

h1 {
  margin: 0;
  font-size: clamp(24px, 4vw, 34px);
  line-height: 1.25;
}

.save-state {
  flex: 0 0 auto;
  padding: 8px 12px;
  border: 1px solid rgb(255 255 255 / 22%);
  border-radius: 999px;
  color: #dcebe5;
  background: rgb(255 255 255 / 8%);
  font-size: 13px;
}

.page-shell {
  padding: 24px 0 40px;
}

.station-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  overflow-x: auto;
}

.station-tab {
  min-width: 82px;
  padding: 10px 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--forest-900);
  background: var(--surface);
  cursor: pointer;
  font-weight: 700;
}

.station-tab.active {
  border-color: var(--forest-900);
  color: #fff;
  background: var(--forest-900);
}

.summary-tab {
  min-width: 108px;
}

.produce-tab {
  min-width: 108px;
  border-color: #b9d6c9;
  background: #edf6f1;
}

.station-tab:focus-visible {
  outline: 3px solid rgb(42 128 104 / 20%);
  outline-offset: 2px;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}

.search-box {
  width: min(460px, 100%);
  height: 46px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: 0 2px 8px rgb(34 52 44 / 4%);
}

.search-box span {
  color: var(--muted);
  font-size: 24px;
  line-height: 1;
}

.search-box:focus-within {
  border-color: var(--focus);
  box-shadow: 0 0 0 3px rgb(42 128 104 / 14%);
}

.search-box input {
  width: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  outline: 0;
  color: var(--ink);
  background: transparent;
}

.item-count,
.storage-note {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

.prep-sync {
  display: grid;
  grid-template-columns: minmax(240px, 1fr) auto auto;
  align-items: end;
  gap: 14px;
  margin-bottom: 14px;
  padding: 14px;
  border: 1px solid #cfe0d8;
  border-radius: 14px;
  background: #edf6f1;
}

.prep-sync strong { color: var(--forest-900); }
.prep-sync p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.prep-sync label { color: #53605a; font-size: 12px; font-weight: 700; }
.prep-sync input {
  display: block;
  height: 42px;
  margin-top: 5px;
  padding: 0 10px;
  border: 1px solid #bfcfc7;
  border-radius: 10px;
  background: #fff;
}
.prep-sync button {
  height: 42px;
  padding: 0 16px;
  border: 0;
  border-radius: 10px;
  color: #fff;
  background: var(--forest-900);
  cursor: pointer;
  font-weight: 800;
}
.number-input[data-field="station"][readonly] {
  color: var(--forest-900);
  background: #eef5f1;
  font-weight: 800;
}

.conversion-hint {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.35;
}

.inventory-unit-label {
  display: block;
  margin-bottom: 5px;
  color: var(--forest-700);
  font-size: 12px;
  font-weight: 800;
  line-height: 1;
  text-align: center;
}

@media (max-width: 720px) {
  .prep-sync { grid-template-columns: 1fr 1fr; }
  .prep-sync > div { grid-column: 1 / -1; }
}

@media (max-width: 520px) {
  .header-inner {
    min-height: 96px;
  }

  .header-title {
    gap: 10px;
  }

  .home-link {
    padding: 8px 9px;
  }
}

.table-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: 0 5px 20px rgb(34 52 44 / 6%);
}

.table-scroll {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.summary-station-cell,
.summary-total-cell {
  text-align: center;
  font-variant-numeric: tabular-nums;
}

body:has(.summary-tab.active) table {
  min-width: 900px;
}

body:has(.summary-tab.active) th:nth-child(1) { width: 34%; }
body:has(.summary-tab.active) th:nth-child(2) { width: 12%; }
body:has(.summary-tab.active) th:nth-child(3) { width: 16%; }
body:has(.summary-tab.active) th:nth-child(4),
body:has(.summary-tab.active) th:nth-child(5),
body:has(.summary-tab.active) th:nth-child(6),
body:has(.summary-tab.active) th:nth-child(7),
body:has(.summary-tab.active) th:nth-child(8) { width: 8.5%; }

body:has(.produce-tab.active) th:nth-child(1) { width: 42%; }
body:has(.produce-tab.active) th:nth-child(2) { width: 16%; }
body:has(.produce-tab.active) th:nth-child(3),
body:has(.produce-tab.active) th:nth-child(4),
body:has(.produce-tab.active) th:nth-child(5) { width: 14%; }

.produce-prep-cell {
  color: #53605a;
  background: #f5f7f5;
}

th,
td {
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}

th {
  position: sticky;
  top: 0;
  z-index: 1;
  padding: 13px 14px;
  color: #53605a;
  background: #f7f9f7;
  font-size: 13px;
  font-weight: 700;
  text-align: left;
}

td {
  padding: 11px 14px;
  background: var(--surface);
}

tbody tr:last-child td {
  border-bottom: 0;
}

tbody tr:hover td {
  background: #fbfcfb;
}

th:nth-child(1) {
  width: 43%;
}

th:nth-child(2) {
  width: 15%;
}

th:nth-child(3),
th:nth-child(4),
th:nth-child(5) {
  width: 14%;
}

.item-name {
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.unit {
  color: var(--muted);
  font-size: 14px;
}

.number-input {
  width: 100%;
  min-width: 72px;
  height: 42px;
  padding: 8px 10px;
  border: 1px solid #cfd8d3;
  border-radius: 9px;
  outline: 0;
  color: var(--ink);
  background: #fff;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.number-input:focus {
  border-color: var(--focus);
  box-shadow: 0 0 0 3px rgb(42 128 104 / 13%);
}

.total-cell {
  color: var(--forest-900);
  background: var(--total);
  font-weight: 700;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

tbody tr:hover .total-cell {
  background: var(--total);
}

.summary-category-row th {
  background: #dfece7;
  color: #173f35;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.08em;
  padding: 11px 14px;
  text-align: left;
}

.summary-category-row:hover th {
  background: #dfece7;
}

.empty-state {
  padding: 48px 20px;
  color: var(--muted);
  text-align: center;
}

.storage-note {
  padding: 12px 2px 0;
  text-align: right;
}

@media (max-width: 700px) {
  .header-inner,
  .page-shell {
    width: min(100% - 20px, 1180px);
  }

  .header-inner {
    min-height: 96px;
  }

  .save-state {
    padding: 7px 9px;
    font-size: 12px;
  }

  .page-shell {
    padding-top: 16px;
  }

  .toolbar {
    align-items: stretch;
    flex-direction: column;
    gap: 8px;
  }

  .item-count {
    padding-left: 2px;
  }

  .table-card {
    overflow: visible;
    border: 0;
    background: transparent;
    box-shadow: none;
  }

  .table-scroll { overflow: visible; }

  table,
  tbody { display: block; width: 100%; }

  thead { display: none; }

  tbody tr {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: var(--surface);
    box-shadow: 0 4px 16px rgb(34 52 44 / 6%);
  }

  tbody tr[hidden] { display: none; }

  tbody tr:hover td { background: transparent; }

  td {
    display: block;
    width: auto !important;
    padding: 0;
    border: 0;
    background: transparent;
  }

  .item-name {
    grid-column: 1 / -1;
    font-size: 16px;
    font-weight: 800;
  }

  .unit {
    grid-column: 1 / -1;
    margin-top: -5px;
    font-size: 13px;
  }

  .unit::before { content: "單位："; }

  .inventory-field::before,
  .total-cell::before {
    display: block;
    margin-bottom: 5px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-align: left;
  }

  .inventory-field::before { content: attr(data-label); }
  .total-cell::before { content: attr(data-label); }

  .inventory-unit-label {
    display: inline-block;
    margin: 0 0 5px 5px;
  }

  .number-input {
    min-width: 0;
    height: 50px;
    padding: 8px 12px;
    font-size: 18px;
  }

  .total-cell {
    grid-column: 1 / -1;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 18px;
  }

  .total-cell::before {
    display: inline;
    margin-right: 8px;
  }
}

@media (prefers-reduced-motion: no-preference) {
  .save-state {
    transition:
      color 160ms ease,
      background 160ms ease;
  }
}

    <script>
(function () {
  "use strict";

  const STORES = [
    { id: "taipei101", name: "台北101" },
    { id: "nangang", name: "南港" },
    { id: "taipei-dome", name: "大巨蛋" },
  ];
  const SELECTION_KEY = "kitchen-os:selected-store";
  const nativeGet = Storage.prototype.getItem;
  const nativeSet = Storage.prototype.setItem;
  const nativeRemove = Storage.prototype.removeItem;
  const nativeKey = Storage.prototype.key;
  const selectedId = nativeGet.call(localStorage, SELECTION_KEY);
  const selected = STORES.find((store) => store.id === selectedId) || null;

  function prefix(key) {
    return `kitchen-os:store:${selected.id}:${key}`;
  }

  function choose(id) {
    if (!STORES.some((store) => store.id === id)) return;
    nativeSet.call(localStorage, SELECTION_KEY, id);
    location.href = "index.html";
  }

  function clearSelection() {
    nativeRemove.call(localStorage, SELECTION_KEY);
    location.href = "index.html";
  }

  window.KitchenStore = {
    stores: STORES,
    current: selected,
    choose,
    clearSelection,
    cloudId(id) {
      if (!selected) return id;
      return `${selected.id}--${id}`;
    },
    legacyCloudId(id) {
      return selected?.id === "taipei101" ? id : null;
    },
    rawGet(key) {
      return nativeGet.call(localStorage, key);
    },
  };

  if (!selected) {
    if (!/(^|\/)index\.html$/.test(location.pathname) && !location.pathname.endsWith("/")) {
      location.replace("index.html");
    }
    return;
  }

  // 所有既有本機資料鍵自動加上店鋪範圍。台北101第一次讀取時，
  // 會從舊版未分店的資料遷移，確保升級後原盤點仍保留。
  Storage.prototype.getItem = function (key) {
    if (this !== localStorage || key === SELECTION_KEY) return nativeGet.call(this, key);
    const scoped = nativeGet.call(this, prefix(key));
    if (scoped !== null) return scoped;
    if (selected.id === "taipei101") {
      const legacy = nativeGet.call(this, key);
      if (legacy !== null) nativeSet.call(this, prefix(key), legacy);
      return legacy;
    }
    return null;
  };
  Storage.prototype.setItem = function (key, value) {
    if (this !== localStorage || key === SELECTION_KEY) return nativeSet.call(this, key, value);
    return nativeSet.call(this, prefix(key), value);
  };
  Storage.prototype.removeItem = function (key) {
    if (this !== localStorage || key === SELECTION_KEY) return nativeRemove.call(this, key);
    return nativeRemove.call(this, prefix(key));
  };

  document.addEventListener("DOMContentLoaded", function () {
    const style = document.createElement("style");
    style.textContent = ".store-context-bar{position:sticky;top:0;z-index:10000;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 16px;background:#172554;color:#fff;font:14px -apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;box-shadow:0 2px 8px #0002}.store-context-bar button{border:1px solid #ffffff66;border-radius:999px;background:#fff;color:#172554;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer}";
    document.head.append(style);
    document.documentElement.dataset.store = selected.id;
    const bar = document.createElement("div");
    bar.className = "store-context-bar";
    bar.innerHTML = `<span>目前店鋪：<strong>${selected.name}</strong></span><button type="button">切換店鋪</button>`;
    bar.querySelector("button").addEventListener("click", clearSelection);
    document.body.prepend(bar);
  });
})();

</script>

    <script>
(function(){
  "use strict";
  const KEY="kitchen-os:item-settings:v1";
  const UNIFIED_DEFAULTS_MARKER="kitchen-os:unified-dome-defaults:v1";
  const PRODUCE_ORDER_MARKER="kitchen-os:produce-store-order:v1";
  const PRODUCE_ORDERS={
    "taipei101":["142010SS","144011SS","142013SS","142006SS","142012SS","181005SS","145009SS","145003SS","181002SS","145006SS","145008SS","142001SS","142009SS","145002SS","produce-yellow-lemon","145001SS","142016SS","142015SS","142017SS","181004SS","142030SS","142018SS","141001SS","143001SS","142019SS","181003SS","145004SS","142014SS","142003SS","142002SS","142004SS","145015SS"],
    "nangang":["144011SS","142010SS","142012SS","142006SS","142009SS","142020SS","142001SS","181005SS","181002SS","145003SS","145009SS","145008SS","145002SS","145006SS","181004SS","142019SS","142041SS","145015SS","142004SS","143001SS","141001SS","142015SS","142016SS","142017SS","145001SS","142028SS","142030SS","142029SS","168021SS","142014SS","145004SS","181003SS","142013SS","produce-yellow-lemon","144013SS"],
    "taipei-dome":["142010SS","144011SS","142013SS","142006SS","142012SS","181005SS","145009SS","145003SS","181002SS","145006SS","145008SS","142001SS","142037SS","142009SS","145002SS","produce-yellow-lemon","145001SS","142016SS","142015SS","142017SS","181004SS","168021SS","142030SS","142018SS","141001SS","143001SS","142019SS","181003SS","145004SS","142014SS","142003SS","142002SS","142004SS","145015SS","144013SS","142028SS"]
  };
  const TYPES=["weekly","central","prep"];
  const STATIONS=["s1","s2","pizza","cold"];
  if(window.KitchenStore?.current && window.KitchenStore.current.id!=="taipei-dome" && !localStorage.getItem(UNIFIED_DEFAULTS_MARKER)){
    localStorage.removeItem(KEY);
    localStorage.setItem(UNIFIED_DEFAULTS_MARKER,"1");
  }
  function read(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){return {}}}
  let cloudDb=null,cloudUnsub=null;
  function writeLocal(data){localStorage.setItem(KEY,JSON.stringify(data))}
  function cloudDoc(){const sid=window.KitchenStore?.current?.id;return cloudDb&&sid?cloudDb.collection("itemSettings").doc(sid):null}
  function write(data){
    writeLocal(data);
    const ref=cloudDoc();
    if(ref) ref.set({settingsJson:JSON.stringify(data),updatedAt:new Date().toISOString()},{merge:true})
      .catch(e=>console.error("品項設定雲端同步失敗",e));
  }
  function configureCloud(db){
    if(!db||!window.KitchenStore?.current)return Promise.resolve();
    cloudDb=db;
    if(cloudUnsub)cloudUnsub();
    const ref=cloudDoc();
    return new Promise(resolve=>{let first=true;cloudUnsub=ref.onSnapshot(snap=>{
      const d=snap.exists?snap.data():null;
      let remote=null;
      if(d?.settingsJson){
        try{remote=JSON.parse(d.settingsJson)}catch(e){console.warn("品項設定 JSON 解析失敗",e)}
      }
      if(!remote && d?.settings && typeof d.settings==="object") remote=d.settings;
      if(remote&&typeof remote==="object"){
        const before=JSON.stringify(read()),after=JSON.stringify(remote);
        if(before!==after){writeLocal(remote);setTimeout(()=>location.reload(),50)}
      }else if(first){
        const local=read();
        if(Object.keys(local).length)ref.set({settingsJson:JSON.stringify(local),updatedAt:new Date().toISOString()},{merge:true}).catch(console.error)
      }
      first=false;resolve();
    },e=>{console.warn("品項設定雲端讀取失敗，暫用本機",e);resolve()})})
  }
  function key(type,station){return type+":"+station}
  function normalizeCfg(value){
    const c=(value&&typeof value==="object"&&!Array.isArray(value))?value:{};
    // 相容舊版／不同裝置曾寫入的格式；任何異常欄位都回復為空陣列，
    // 避免 .forEach / 展開運算直接中斷整張 Weekly。
    if(!Array.isArray(c.order)) c.order=[];
    if(!Array.isArray(c.hidden)) c.hidden=[];
    if(!Array.isArray(c.custom)){
      if(typeof c.custom==="string"){
        try{const parsed=JSON.parse(c.custom);c.custom=Array.isArray(parsed)?parsed:[]}catch(_){c.custom=[]}
      }else c.custom=[];
    }
    return c;
  }
  function get(type,station){return normalizeCfg(read()[key(type,station)])}
  function set(type,station,value){const all=read();all[key(type,station)]=normalizeCfg(value);write(all)}
  function idFor(type,item,index){
    if(type==="weekly") return item._customId||("base:"+(item.code||"")+":"+item.order+":"+item.name);
    return item._customId||item[6]||("base:"+(item[5]||index+1)+":"+item[0]+":"+(item[1]||""));
  }
  function apply(type,station,base){
    const cfg=get(type,station), hidden=new Set(cfg.hidden||[]), byId=new Map();
    base.forEach((item,index)=>byId.set(idFor(type,item,index),item));
    (Array.isArray(cfg.custom)?cfg.custom:[]).forEach((item,index)=>byId.set(idFor(type,item,index),item));
    if(type==="weekly"&&station==="produce"&&window.KitchenStore?.current&&!localStorage.getItem(PRODUCE_ORDER_MARKER)){
      const wanted=PRODUCE_ORDERS[window.KitchenStore.current.id]||[];
      const rank=new Map(wanted.map((code,index)=>[code,index]));
      const entries=[...byId.entries()];
      entries.sort((a,b)=>{
        const ai=rank.has(a[1].code)?rank.get(a[1].code):Number.MAX_SAFE_INTEGER;
        const bi=rank.has(b[1].code)?rank.get(b[1].code):Number.MAX_SAFE_INTEGER;
        return ai-bi;
      });
      cfg.order=entries.map(([id])=>id);
      cfg.hidden=[];
      set(type,station,cfg);
      localStorage.setItem(PRODUCE_ORDER_MARKER,"1");
    }
    const ids=[...(cfg.order||[]),...byId.keys()].filter((id,i,a)=>a.indexOf(id)===i&&byId.has(id));
    const result=ids.filter(id=>!hidden.has(id)).map(id=>byId.get(id));

    // 明日現場盤點優先保留完整基礎品項；之後仍可在排序/顯示設定重新調整。
    if(type==="weekly" && base.length && result.length===0){
      console.warn("Weekly 品項設定異常：整站為空，已自動恢復基礎品項",station);
      return base.slice();
    }
    return result;
  }
  function openManager(type,station,base,onDone){
    const cfg=get(type,station), all=new Map();
    base.forEach((item,index)=>all.set(idFor(type,item,index),item));

    const box=shade.querySelector('[data-list]');
    function draw(){box.innerHTML='';ids.forEach((id,index)=>{const item=all.get(id),name=type==='weekly'?item.name:item[0],unit=type==='weekly'?item.unit:item[1],row=document.createElement('div');row.draggable=true;row.dataset.id=id;row.style.cssText='display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #e3e7e4;background:#fff';row.innerHTML=`<span style="cursor:grab;font-size:20px">☰</span><input type="checkbox" ${hidden.has(id)?'':'checked'} aria-label="顯示 ${name}"><div><b>${name}</b><small style="display:block;color:#748079">${unit||'未設定單位'}</small></div>`;row.querySelector('input').onchange=e=>e.target.checked?hidden.delete(id):hidden.add(id);row.ondragstart=e=>{e.dataTransfer.setData('text/plain',id);row.style.opacity='.35'};row.ondragend=()=>row.style.opacity='1';row.ondragover=e=>e.preventDefault();row.ondrop=e=>{e.preventDefault();const from=e.dataTransfer.getData('text/plain'),to=id;if(from===to)return;ids.splice(ids.indexOf(from),1);ids.splice(ids.indexOf(to),0,from);draw()};box.append(row)})}
    shade.querySelector('[data-close]').onclick=()=>shade.remove();shade.querySelector('[data-reset]').onclick=()=>{ids=[...all.keys()];hidden.clear();draw()};shade.querySelector('[data-save]').onclick=()=>{cfg.order=ids;cfg.hidden=[...hidden];set(type,station,cfg);shade.remove();onDone&&onDone()};document.body.append(shade);draw();
  }

// 正確原料，儲位仍由下午蔬菜統一盤，站上只承接備料回推與人工盤點。
function ensureStationWeeklyItem(station, code, name, unit) {
  let item = STATIONS[station].items.find((entry) => entry.code === code);
  if (item) return item;
  const nextOrder = Math.max(0, ...STATIONS[station].items.map((entry) => Number(entry.order) || 0)) + 1;
  item = { order: nextOrder, code, name, unit };
  STATIONS[station].items.push(item);
  return item;
}

// 大巨蛋的周盤順序來自店內冷凍／冷藏／乾貨母表。既有換算規則
// 用品項代碼（無代碼時用品名）重新定位，避免沿用 101 的列號而套錯品項。
if (KitchenStore.current) {
  const normalizeItemName = (value) => String(value || "").toLowerCase().replace(/[\s\-_.\/()（）*×]/g, "").replace(/蕃/g, "番");
  const locateNewOrder = (station, oldOrder) => {
    const source = LEGACY_STATION_ITEMS[station]?.find((item) => String(item.order) === String(oldOrder));
    if (!source) return null;
    const match = STATIONS[station]?.items.find((item) =>
      (source.code && item.code && source.code === item.code) ||
      normalizeItemName(source.name) === normalizeItemName(item.name)
    );

  return `kitchen-os-v4.1:101:${station}:weekly:${date}`;

    const saved = JSON.parse(localStorage.getItem(storageKey(station)) || "{}");
    return saved && typeof saved === "object" ? saved : {};
  } catch {
    return {};
  }
}

function toNumber(value) {
  const number = Number.parseFloat(value);
  return Number.isFinite(number) ? number : 0;
}

function formatNumber(value) {
  return Number.isInteger(value)
    ? String(value)
    : String(Number(value.toFixed(3)));
}

    ? toNumber(values.storage) * conversion.storageFactor +
        toNumber(values.station) * conversion.stationFactor
    : toNumber(values.storage) + toNumber(values.station);
}

function stationOnlyTotal(station, item, stationInventory = loadInventory(station)) {
  const values = stationInventory[item.order] || {};
  const conversion = item?.customPackGrams
    ? { stationFactor: 1 / item.customPackGrams }
    : WEEKLY_CONVERSIONS[station]?.[item.order];
  return toNumber(values.station) * (conversion?.stationFactor ?? 1);
}

function producePrepTotal(item) {
  return SUMMARY_STATION_ORDER.reduce((sum, station) => {
    const matching = STATIONS[station].items.filter((entry) => entry.code === item.code);
    const stationInventory = loadInventory(station);
    return sum + matching.reduce((stationSum, entry) => {
      const values = stationInventory[entry.order] || {};
      if (!values.prepLinked) return stationSum;
      // prepValue 已由 PREP_TO_WEEKLY 換算成品項主單位（kg／盒／袋），
      // 不可再套用站上人工盤 g 的換算倍率，否則會被重複除以 1000。
      return stationSum + toNumber(values.prepValue);
    }, 0);
  }, 0);
}

function produceManualValue(item, produceInventory = loadInventory("produce")) {
  return toNumber(produceInventory[item.order]?.quantity);
}

function normalizedItemName(name) {
  return name
    .replace(/[\s\-_/().（）]/g, "")
    .replace(/蕃/g, "番")
    .replace(/甘蔥/g, "乾蔥")
    .replace(/\d+(?:\.\d+)?(?:KG|K|G|ML|L)/gi, "")
    .toLocaleLowerCase("zh-Hant");
}

const SUMMARY_STATION_ORDER = ["s1", "s2", "pizza", "cold"];
const SUMMARY_CATEGORY_ORDER = ["冷凍", "冷藏", "乾貨"];

function summaryCategory(station, item) {
  if (SUMMARY_CATEGORY_ORDER.includes(item?.location)) return item.location;
  const order = item?.order;
  if (station === "s1") {
    if (order <= 27) return "冷凍";
    if ((order >= 28 && order <= 41) || order >= 52) return "冷藏";
    return "乾貨";
  }
  if (station === "s2") {
    if (order <= 30) return "冷凍";
    if ((order >= 31 && order <= 35) || order === 42) return "冷藏";
    return "乾貨";
  }
  if (station === "pizza") {
    if (order === 1) return "冷凍";
    if (order <= 17) return "冷藏";
    return "乾貨";
  }
  if (order <= 26) return "冷凍";
  if ((order >= 27 && order <= 46) || order === 57 || order === 58 || order >= 70) return "冷藏";
  return "乾貨";
}

function summaryRows() {
  const ambiguousCodes = new Set();
  Object.values(STATIONS).forEach((station) => {
    const seen = new Set();
    station.items.forEach((item) => {
      if (!item.code) return;
      if (seen.has(item.code)) ambiguousCodes.add(item.code);
      seen.add(item.code);
    });
  });

  const rows = new Map();
  SUMMARY_STATION_ORDER.forEach((stationKey, stationRank) => {
    const station = STATIONS[stationKey];
    const stationInventory = loadInventory(stationKey);
    station.items.forEach((item, itemRank) => {
      const afternoonProduce = isAfternoonProduce(item);
      const total = afternoonProduce
        ? stationOnlyTotal(stationKey, item, stationInventory)
        : itemTotal(stationKey, item, stationInventory);
      const normalizedName = normalizedItemName(item.name);
      const key = afternoonProduce && item.code
        ? `code:${item.code}`
        : item.code && !ambiguousCodes.has(item.code)
        ? `code:${item.code}`
        : `name:${normalizedName}|${item.unit}`;
      if (!rows.has(key)) {
        rows.set(key, {
          name: item.name,
          unit: item.unit || "—",
          search: `${item.name} ${item.unit} ${item.code}`.toLocaleLowerCase("zh-Hant"),
          stations: { cold: 0, s1: 0, s2: 0, pizza: 0, produce: 0 },
          category: summaryCategory(stationKey, item),
          stationRank,
          itemRank,
        });
      }
      const row = rows.get(key);
      row.stations[stationKey] += total;
      row.search += ` ${item.name}`.toLocaleLowerCase("zh-Hant");
    });
  });
  if (produceEnabled) {
    const produceInventory = loadInventory("produce");
    AFTERNOON_PRODUCE_ITEMS.forEach((item, itemRank) => {
      const key = `code:${item.code}`;
      const row = rows.get(key) || {
        name: item.name,
        unit: item.unit,
        search: `${item.name} ${item.unit} ${item.code}`.toLocaleLowerCase("zh-Hant"),
        stations: { cold: 0, s1: 0, s2: 0, pizza: 0, produce: 0 },
        category: "冷藏",
        stationRank: -1,
        itemRank,
      };
      // 下午蔬菜欄只放主管盤的冷藏儲位；各站人工站上與備料回推
      // 已包含在各站欄位，這裡不可再加 producePrepTotal，避免重複。
      row.stations.produce = produceManualValue(item, produceInventory);
      row.category = "冷藏";
      row.itemRank = itemRank;
      rows.set(key, row);
    });
  }
  return [...rows.values()].sort((a, b) =>
    SUMMARY_CATEGORY_ORDER.indexOf(a.category) - SUMMARY_CATEGORY_ORDER.indexOf(b.category) ||
    a.stationRank - b.stationRank ||
    a.itemRank - b.itemRank,
  );
}

function weeklyCloudRef(station, date = selectedWeeklyDate()) {
  return db?.collection("weeklyInventory").doc(KitchenStore.cloudId(`${station}-weekly-${date}`)) || null;
}

async function syncWeeklyToCloud(station, fullInventory = null) {
  if (station === "summary" || !db) return;
  const stationInventory = fullInventory || loadInventory(station);
  const payload = {
    storeId: KitchenStore.current.id,
    station,
    inventoryDate: selectedWeeklyDate(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
  if (fullInventory) {
    payload.inventory = stationInventory;
  } else {
    payload.inventory = {};
    [...dirtyWeeklyFields].forEach((path) => {
      const [dirtyStation, order, field] = path.split("|");
      if (dirtyStation !== station) return;
      payload.inventory[order] ||= {};
      payload.inventory[order][field] = stationInventory?.[order]?.[field] ?? "";
      dirtyWeeklyFields.delete(path);
    });
    if (!Object.keys(payload.inventory).length) return;
  }
  try {
    await weeklyCloudRef(station).set(payload, { merge: true });
  } catch (error) {
    console.warn("Weekly 雲端同步暫緩，保留本機資料", error);
  }
}

function startWeeklyRealtime(station) {
  const date = selectedWeeklyDate();
  const subscriptionKey = `${station}|${date}`;
  if (!db || weeklyUnsubscribers.has(subscriptionKey)) return;
  let receivedFirstSnapshot = false;
  const unsubscribe = weeklyCloudRef(station, date).onSnapshot({ includeMetadataChanges: true }, (snap) => {
    if (snap.metadata.hasPendingWrites) return;
    // 備料回推會一次更新四站。期間收到的 Weekly 舊快照不可覆蓋
    // 剛算好的站上數字；結束後的短暫緩衝也避開伺服器回送舊快照。
    if (prepSyncInProgress || Date.now() - prepSyncFinishedAt < 1500) return;
    if (!snap.exists) {
      if (!receivedFirstSnapshot) {
        receivedFirstSnapshot = true;
        const localInventory = loadInventory(station);
        if (Object.keys(localInventory).length) syncWeeklyToCloud(station, localInventory);
      }
      return;
    }
    receivedFirstSnapshot = true;
    const cloudInventory = snap.data()?.inventory;
    if (!cloudInventory || typeof cloudInventory !== "object") return;
    // 若本機已有同日期的備料回推，而雲端快照尚未包含該列，保留本機
    // 回推值；其餘儲位與人工欄位仍照常接受跨裝置同步。
    const localInventory = loadInventory(station);
    Object.entries(localInventory).forEach(([order, localRow]) => {
      if (!localRow?.prepLinked || localRow.prepDate !== date) return;
      const cloudRow = cloudInventory[order];
      if (cloudRow?.prepLinked && cloudRow.prepDate === date) return;
      cloudInventory[order] = { ...(cloudRow || {}), ...localRow };
    });
    localStorage.setItem(storageKey(station, date), JSON.stringify(cloudInventory));
    if (station !== activeStation) return;
    inventory = cloudInventory;
    if (!inventoryBody.querySelector(".number-input:focus")) renderItems();
    saveState.textContent = "已收到其他裝置更新";
  }, (error) => console.warn("Weekly 即時監聽暫停", error));
  weeklyUnsubscribers.set(subscriptionKey, unsubscribe);
}

function restartWeeklyRealtimeForDate() {
  weeklyUnsubscribers.forEach((unsubscribe) => unsubscribe());
  weeklyUnsubscribers.clear();
  ["cold", "s1", "s2", "pizza", "produce"].forEach(startWeeklyRealtime);
}

function dateKey(date = new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

async function getPrepInventory(station, date) {
  const logicalKey = `kos-daily-v06-prep-${station}-${date}`;
  let localData = null;
  try {
    localData = JSON.parse(localStorage.getItem(logicalKey) || "null");
  } catch (error) {
    console.warn("本機備料盤點格式錯誤", error);
  }
  if (!localData?.rows && KitchenStore.rawGet) {
    const storeToken = `kitchen-os:store:${KitchenStore.current.id}:`;
    for (let index = 0; index < localStorage.length; index += 1) {
      const physicalKey = localStorage.key(index) || "";
      if (!physicalKey.endsWith(logicalKey) || !physicalKey.includes(storeToken)) continue;
      try {
        const candidate = JSON.parse(KitchenStore.rawGet(physicalKey) || "null");
        if (!candidate?.rows) continue;
        localData = candidate;
        localStorage.setItem(logicalKey, JSON.stringify(candidate));
        break;
      } catch (error) {
        console.warn("略過無法解析的舊備料存檔", physicalKey, error);
      }
    }
  }
  // 同一台裝置已存有當日盤點時直接使用，不可先被雲端等待或舊快照影響。
  if (localData?.rows) return localData;
  let data = null;
  try {
    if (!db) throw new Error("offline-local-fallback");
    const documentIds = [
      KitchenStore.cloudId(`prep-${station}-${date}`),
      `prep-${station}-${date}`,
    ].filter((value, index, list) => value && list.indexOf(value) === index);
    const withTimeout = (promise, milliseconds, label) => Promise.race([
      promise,
      new Promise((_, reject) => window.setTimeout(
        () => reject(new Error(`${label}-timeout`)),
        milliseconds,
      )),
    ]);
    let snap = null;
    for (const documentId of documentIds) {
      const ref = db.collection("dailyInventory").doc(documentId);
      try {
        // 與 Daily 儲存頁使用相同的 Firestore 預設通道，讓 SDK 自行處理
        // 線上讀取與快取；不要在 Weekly 單獨強制 server/cache 模式。
        const candidate = await withTimeout(ref.get(), 8000, "default-read");
        if (candidate.exists) {
          snap = candidate;
          break;
        }
      } catch (error) {
        console.warn("備料盤點文件讀取失敗", documentId, error);
      }
    }
    if (snap?.exists) data = snap.data();
  } catch (error) {
    console.warn("雲端備料盤點讀取失敗，改用本機資料", error);
  }
  // 同裝置剛完成的盤點可能仍在等待上傳；以 updatedAtLocal 較新的版本為準。
  const cloudTime = Date.parse(data?.updatedAtLocal || "") || 0;
  const localTime = Date.parse(localData?.updatedAtLocal || "") || 0;
  return localTime > cloudTime ? localData : (data || localData);
}

async function loadPrepInventoryCore() {
  const date = inventoryDate.value;
  if (!date) return;
  prepSyncMessage.textContent = "正在讀取備料盤點…";
  let linked = 0;
  let missingStations = 0;
  let s2ShallotValue = null;
  let coldTomatoValues = null;
  let coldTruffleValue = null;
  const stationResults = [];

  function resolveTargetOrder(station, rule) {
    const items = STATIONS[station]?.items || [];
    if (rule.targetCode) {
      const exact = items.find((item) =>
        item.code === rule.targetCode &&
        (!rule.targetName || item.name.includes(rule.targetName))
      );
      if (exact) return exact.order;
    }
    if (rule.targetName) {
      const byName = items.find((item) => item.name.includes(rule.targetName));
      if (byName) return byName.order;
    }
    return rule.order;
  }

  // Weekly 的「站上」只可來自所選日期已儲存的備料盤點。
  // 舊版有些回推數字遺失 prepLinked 標記，因此不能只清有標記的列；
  // 每次重新抓取都先清空全部站上值，再用當日存檔重新計算。
  // 「儲位」為人工盤點，完全不受影響。
  function clearPreviousPrepLinks(stationInventory) {
    Object.values(stationInventory).forEach((current) => {
      if (!current || typeof current !== "object") return;
      current.station = "";
      delete current.manualStation;
      delete current.prepValue;
      delete current.prepLinked;
      delete current.prepDate;
      delete current.prepNote;
    });
  }

  function addPrepValue(station, stationInventory, targetOrder, value, note) {
    stationInventory[targetOrder] ||= {};
    const current = stationInventory[targetOrder];
    const manualStation = 0;
    current.manualStation = "0";
    current.prepValue = formatNumber(value);
    const targetItem = STATIONS[station]?.items.find((item) => String(item.order) === String(targetOrder));
    const conversion = targetItem?.customPackGrams
      ? { stationFactor: 1 / targetItem.customPackGrams }
      : WEEKLY_CONVERSIONS[station]?.[targetOrder];
    const prepInStationInputUnit = conversion?.stationFactor
      ? value / conversion.stationFactor
      : value;
    current.station = formatNumber(manualStation + prepInStationInputUnit);
    current.prepLinked = true;
    current.prepDate = date;
    current.prepNote = note || `由 ${date} 備料盤點換算`;
  }

  // 四站同時讀取，避免一站連線緩慢時讓其他三站一起排隊等待。
  const prepInventoryByStation = Object.fromEntries(await Promise.all(
    Object.keys(PREP_TO_WEEKLY).map(async (station) => [
      station,
      await getPrepInventory(station, date),
    ]),
  ));

  for (const [station, rules] of Object.entries(PREP_TO_WEEKLY)) {
    const saved = prepInventoryByStation[station];
    const stationInventory = loadInventory(station);
    clearPreviousPrepLinks(stationInventory);
    if (!saved?.rows) {
      missingStations += 1;
      stationResults.push(`${STATIONS[station].label}未找到`);
      localStorage.setItem(storageKey(station), JSON.stringify(stationInventory));
      void syncWeeklyToCloud(station, stationInventory);
      continue;
    }
    const savedRows = Array.isArray(saved.rows)
      ? saved.rows
      : Object.values(saved.rows || {});
    const normalizePrepName = (value) => String(value || "")
      .toLocaleLowerCase("zh-Hant")
      .replace(/蕃/g, "番")
      .replace(/pizza/g, "披薩")
      .replace(/熟|退冰|當日|盤重量|冷凍需盤入/g, "")
      .replace(/\d+(?:\.\d+)?\s*(?:kg|k|g|公克|公斤|cm|份|顆)/gi, "")
      // Daily 可能顯示 4X4cm、4×4cm 或 4x4cm；三種都代表同一規格。
      // 先轉小寫後同時移除 x 與 ×，避免已存資料因字型符號不同而被跳過。
      .replace(/[\s\-_/／().（）x×*～~＋+]/g, "");
    const findSavedRow = (rowIndex, explicitName = "") => {
      const expectedName = explicitName || DATA.prep?.[station]?.[rowIndex]?.[0] || "";
      const expected = normalizePrepName(expectedName);
      if (expected) {
        // 先找完全相同的標準化品名，再做包含比對；例如「薄荷」不可先誤抓
        // 「薄荷醬」，「章魚75g」不可誤抓「章魚沙拉／章魚馬鈴薯」。
        const exact = savedRows.find((row) => normalizePrepName(row?.name) === expected);
        const named = exact || savedRows.find((row) => {
          const actual = normalizePrepName(row?.name);
          return actual && (actual.includes(expected) || expected.includes(actual));
        });
        if (named) return named;
      }
      // 旧存档没有保存 name 时才使用原列号，避免排序后误抓别的品项。
      const indexed = savedRows[rowIndex];
      return indexed && !indexed.name ? indexed : null;
    };
    // v18 修正：舊版曾將 S2 甘蔥碎誤寫到第 41 項白米。
    // 只清除由該錯誤回推建立的數字，不影響人員手動盤點的白米。
    if (
      station === "s2" &&
      stationInventory[41]?.prepLinked &&
      /甘蔥碎|乾蔥/.test(stationInventory[41]?.prepNote || "")
    ) {
      delete stationInventory[41].station;
      delete stationInventory[41].prepLinked;
      delete stationInventory[41].prepDate;
      delete stationInventory[41].prepNote;
    }
    const convertedByTarget = new Map();
    rules.forEach((rule) => {
      try {
      let hasValue = false;
      let converted = 0;
      if (rule.sourcesAny) {
        const matchedIndex = rule.sourcesAny.find((rowIndex) => {
          const raw = findSavedRow(rowIndex, rule.sourceName)?.actual;
          return raw !== "" && raw != null && Number.isFinite(Number(raw));
        });
        if (matchedIndex != null) {
          hasValue = true;
          converted = toNumber(findSavedRow(matchedIndex, rule.sourceName)?.actual) * rule.factor;
        }
      } else {
        converted = rule.sources.reduce((sum, [rowIndex, factor], sourceIndex) => {
          const explicitSourceName = rule.sourceNames?.[sourceIndex] || rule.sourceName;
          const raw = findSavedRow(rowIndex, explicitSourceName)?.actual;
          if (raw !== "" && raw != null && Number.isFinite(Number(raw))) hasValue = true;
          return sum + toNumber(raw) * factor;
        }, 0);
      }
      if (!hasValue) return;
      const targetOrder = resolveTargetOrder(station, rule);
      // 品項設定若尚未包含回推目標，不可把數字寫進 undefined 欄位。
      // 這也讓 S1 的配方核對更容易：只有實際存在於該站周盤的原料才會帶入。
      if (targetOrder == null) return;
      const entry = convertedByTarget.get(targetOrder) || { value: 0, notes: [] };
      entry.value += converted;
      if (rule.note) entry.notes.push(rule.note);
      convertedByTarget.set(targetOrder, entry);
      if (station === "s2" && rule.targetCode === "142004SS") {
        s2ShallotValue = formatNumber(converted);
      }
      if (station === "cold" && rule.targetCode === "168015SS") {
        coldTruffleValue = formatNumber(converted);
      }
      linked += 1;
      } catch (error) {
        console.warn(`${STATIONS[station].label} 單項備料回推略過`, rule, error);
      }
    });

    // v35 Cold 回推：前兩項固定規格鮮蔬只在這裡計算一次，避免與 PREP_TO_WEEKLY 重複加總。\n    // Cold 前兩項是固定規格的鮮蔬。舊存檔曾出現 X／×、全形字元與列名差異，
    // 這兩項直接用品名找原始盤點，再用品項代碼定位 Weekly，完全不依賴列號。
    if (station === "cold") {
      const directColdPrep = [
        {
          name: "羽衣甘藍",
          code: "142020SS",
          fallbackIndex: 0,
          factor: 0.3,
          note: "羽衣甘藍：每盒300g，10盒回推3kg",
        },
        {
          name: "美生菜",
          code: "142044SS",
          fallbackIndex: 1,
          factor: 0.7,
          note: "美生菜：每盒700g，10盒回推7kg",
        },
      ];
      directColdPrep.forEach(({ name, code, fallbackIndex, factor, note }) => {
        const namedRow = savedRows.find((row) => String(row?.name || "").includes(name));
        const sourceRow = namedRow || savedRows[fallbackIndex];
        const raw = sourceRow?.actual;
        if (raw === "" || raw == null || !Number.isFinite(Number(raw))) return;
        const target = STATIONS.cold.items.find((item) => item.code === code);
        if (!target) return;
        // v23：Cold 同一原物料可由多個半成品共同回推，必須加總，不可互相覆蓋。
        // 例如截切美生菜 = 美生菜(4×4cm) 700g + 混合生菜中的美生菜比例。
        const existing = convertedByTarget.get(target.order) || { value: 0, notes: [] };
        if (!convertedByTarget.has(target.order)) linked += 1;
        existing.value += Number(raw) * factor;
        existing.notes.push(note);
        convertedByTarget.set(target.order, existing);
      });
    }

    // 清理由早期版本留下、尚未帶 prepLinked 標記的玉米糖膠錯誤值。
    // 舊版曾把 10 盒換成 10000g 寫入；當天備料未盤玉米糖膠時應歸零。
    if (station === "s1") {
      const cornRule = rules.find((rule) => /玉米糖膠/.test(rule.targetName || rule.note || ""));
      const cornRaw = findSavedRow(3, "玉米糖膠")?.actual;
      const cornOrder = cornRule ? resolveTargetOrder(station, cornRule) : null;
      const cornCurrent = cornOrder == null ? null : stationInventory[cornOrder];
      const cornWasNotCounted = cornRaw === "" || cornRaw == null || !Number.isFinite(Number(cornRaw));
      if (cornWasNotCounted && cornCurrent && toNumber(cornCurrent.station) >= 1000) {
        cornCurrent.station = "";
        delete cornCurrent.manualStation;
        delete cornCurrent.prepValue;
        delete cornCurrent.prepLinked;
        delete cornCurrent.prepDate;
        delete cornCurrent.prepNote;
      }
    }
    convertedByTarget.forEach((entry, targetOrder) => {
      addPrepValue(
        station,
        stationInventory,
        targetOrder,
        entry.value,
        entry.notes.join("；") || `由 ${date} 備料盤點換算`,
      );
    });
    stationResults.push(`${STATIONS[station].label}${convertedByTarget.size}項`);

    // 醃綜合蕃茄固定拆料：直接用品項代碼定位兩種鮮蕃茄，避免名稱中的
    // 「蕃／番」或「綜合櫻」規格文字差異造成同步漏項。
    if (station === "cold") {
      const tomatoBoxesRaw = findSavedRow(13, "醃綜合蕃茄")?.actual;
      if (
        tomatoBoxesRaw !== "" &&
        tomatoBoxesRaw != null &&
        Number.isFinite(Number(tomatoBoxesRaw))
      ) {
        const tomatoKg = toNumber(tomatoBoxesRaw);
        const tomatoTargets = [
          ["144011SS", "聖女蕃茄（中）"],
          ["142022SS", "綜合彩色番茄(綜合櫻)"],
        ];
        tomatoTargets.forEach(([code, name]) => {
          const target = STATIONS.cold.items.find((item) => item.code === code);
          if (!target) return;
          // 兩種番茄已有一般回推規則時，不重複加總，只補強說明。
          if (stationInventory[target.order]?.prepLinked) {
            stationInventory[target.order].prepNote = `醃綜合蕃茄：每盒回推${name} 1kg`;
          } else {
            addPrepValue(
              station,
              stationInventory,
              target.order,
              tomatoKg,
              `醃綜合蕃茄：每盒回推${name} 1kg`,
            );
          }
        });
        coldTomatoValues = formatNumber(tomatoKg);
      }
    }
    localStorage.setItem(storageKey(station), JSON.stringify(stationInventory));
    void syncWeeklyToCloud(station, stationInventory);
  }

  inventory = loadInventory(activeStation);
  renderItems();
  prepSyncMessage.textContent = linked
    ? `已抓取 ${date} 的盤點資料：${stationResults.join("、")}；共更新 ${linked} 個 Weekly 站上數字${missingStations ? `；${missingStations} 站尚未儲存` : ""}。${coldTomatoValues !== null ? ` COLD聖女蕃茄：${coldTomatoValues} kg；綜合彩色番茄：${coldTomatoValues} kg。` : ""}${coldTruffleValue !== null ? ` COLD夏季5%黑松露醬：${coldTruffleValue}罐。` : ""}${s2ShallotValue !== null ? ` S2乾蔥：${s2ShallotValue} kg。` : ""}`
    : `找不到 ${date} 已儲存的備料盤點，請先到「備料每日盤點表」填寫並儲存。`;
  prepSyncFinishedAt = Date.now();
}

async function loadPrepInventory() {
  if (prepSyncInProgress) return;
  prepSyncInProgress = true;
  loadPrepButton.disabled = true;
  try {
    await loadPrepInventoryCore();
  } catch (error) {
    console.warn("備料盤點讀取未完成", error);
    prepSyncMessage.textContent = `備料盤點處理失敗，已保留目前資料（${error?.message || "未知錯誤"}）。`;
  } finally {
    prepSyncInProgress = false;
    prepSyncFinishedAt = Date.now();
    loadPrepButton.disabled = false;
  }
}

function createRow(item) {
  const row = document.createElement("tr");
  row.dataset.search = `${item.name} ${item.unit}`.toLocaleLowerCase("zh-Hant");
  row.dataset.order = String(item.order);

  const nameCell = document.createElement("td");
  nameCell.className = "item-name";
  nameCell.textContent = item.name;
  const conversion = WEEKLY_CONVERSIONS[activeStation]?.[item.order];
  if (conversion) {
    const note = document.createElement("small");
    note.className = "conversion-hint";
    note.textContent = `儲位盤${conversion.storageUnit}｜站上盤${conversion.stationUnit}｜${conversion.note}`;
    nameCell.append(note);
  }

  const unitCell = document.createElement("td");
  unitCell.className = "unit";
  unitCell.dataset.label = "單位";
  unitCell.textContent = item.unit || "—";

  const storageCell = document.createElement("td");
  storageCell.className = "inventory-field storage-field";
  storageCell.dataset.label = "儲位";
  if (isAfternoonProduce(item)) {
    storageCell.classList.add("produce-storage-managed");
    storageCell.textContent = "下午蔬菜統一盤";
  } else if (conversion?.storageUnit) {
    const storageUnit = document.createElement("span");
    storageUnit.className = "inventory-unit-label";
    storageUnit.textContent = `盤${conversion.storageUnit}`;
    storageCell.append(storageUnit);
  }
  if (!isAfternoonProduce(item)) storageCell.append(createNumberInput(item, "storage"));

  const stationCell = document.createElement("td");
  stationCell.className = "inventory-field station-field";
  stationCell.dataset.label = "站上";
  if (conversion?.stationUnit) {
    const stationUnit = document.createElement("span");
    stationUnit.className = "inventory-unit-label";
    stationUnit.textContent = `盤${conversion.stationUnit}`;
    stationCell.append(stationUnit);
  }
  stationCell.append(createNumberInput(item, "station"));

  const totalCell = document.createElement("td");
  totalCell.className = "total-cell";
  totalCell.dataset.label = "TOTAL";
  totalCell.dataset.totalFor = String(item.order);
  totalCell.setAttribute("aria-label", `${item.name} TOTAL`);

  row.append(nameCell, unitCell, storageCell, stationCell, totalCell);
  updateTotal(item.order, totalCell);
  return row;
}

function updateTotal(order, target) {
  const values = inventory[order] || {};
  const item = STATIONS[activeStation]?.items.find((entry) => String(entry.order) === String(order));
  const conversion = item?.customPackGrams
    ? { storageFactor: 1, stationFactor: 1 / item.customPackGrams }
    : WEEKLY_CONVERSIONS[activeStation]?.[order];
  const total = isAfternoonProduce(item)
    ? toNumber(values.station) * (conversion?.stationFactor ?? 1)
    : conversion
      ? toNumber(values.storage) * conversion.storageFactor +
        toNumber(values.station) * conversion.stationFactor
      : toNumber(values.storage) + toNumber(values.station);
  const cell =
    target || document.querySelector(`[data-total-for="${order}"]`);
  if (cell) cell.textContent = formatNumber(total);
}

function renderItems() {
  if (activeStation === "summary") {
    renderSummary();
    return;
  }
  if (activeStation === "produce") {
    renderProduce();
    return;
  }
  const fragment = document.createDocumentFragment();
  STATIONS[activeStation].items
    .forEach((item) => fragment.append(createRow(item)));
  inventoryBody.replaceChildren(fragment);
  filterItems();
}

function filterItems() {
  const query = searchInput.value.trim().toLocaleLowerCase("zh-Hant");
  let visible = 0;

  inventoryBody.querySelectorAll("tr").forEach((row) => {
    const matches = !query || row.dataset.search.includes(query);
    row.hidden = !matches;
    if (matches && !row.classList.contains("summary-category-row")) visible += 1;
  });

  const totalItems = activeStation === "summary"
    ? inventoryBody.querySelectorAll("tr:not(.summary-category-row)").length
    : activeStation === "produce"
      ? AFTERNOON_PRODUCE_ITEMS.length
      : STATIONS[activeStation].items.length;
  itemCount.textContent = query
    ? `顯示 ${visible} / ${totalItems} 項`
    : `共 ${totalItems} 項`;
  emptyState.hidden = visible !== 0;
}

inventoryBody.addEventListener("input", (event) => {
  const input = event.target.closest(".number-input");
  if (!input) return;

  if (input.dataset.produceOrder) {
    const order = input.dataset.produceOrder;
    inventory[order] ||= {};
    inventory[order].quantity = input.value;
    dirtyWeeklyFields.add(`${activeStation}|${order}|quantity`);
    const item = AFTERNOON_PRODUCE_ITEMS.find((entry) => String(entry.order) === order);
    const totalCell = inventoryBody.querySelector(`[data-produce-total-for="${order}"]`);
    if (item && totalCell) {
      totalCell.textContent = formatNumber(toNumber(input.value) + producePrepTotal(item));
    }
    saveInventory();
    return;
  }

  const order = input.dataset.order;
  const field = input.dataset.field;
  inventory[order] ||= {};
  inventory[order][field] = input.value;
  dirtyWeeklyFields.add(`${activeStation}|${order}|${field}`);
  updateTotal(order);
  saveInventory();
});

inventoryBody.addEventListener("focusin", (event) => {
  const input = event.target.closest(".number-input");
  if (input && !input.readOnly) input.select();
});

inventoryBody.addEventListener("keydown", (event) => {
  const input = event.target.closest(".number-input");
  if (!input || event.key !== "Enter") return;
  event.preventDefault();
  const inputs = [...inventoryBody.querySelectorAll(".number-input:not([readonly])")]
    .filter((field) => !field.closest("tr").hidden);
  const next = inputs[inputs.indexOf(input) + 1];
  if (next) next.focus();
  else input.blur();
});

searchInput.addEventListener("input", filterItems);

stationTabs.addEventListener("click", (event) => {
  const tab = event.target.closest(".station-tab");
  if (!tab || tab.dataset.station === activeStation) return;

  activeStation = tab.dataset.station;
  if (activeStation !== "summary") startWeeklyRealtime(activeStation);
  if (activeStation !== "summary") inventory = loadInventory(activeStation);
  searchInput.value = "";
  document.querySelectorAll(".station-tab").forEach((button) => {
    button.classList.toggle("active", button === tab);
  });
  const isSummary = activeStation === "summary";
  const isProduce = activeStation === "produce";
  inventorySection.setAttribute("aria-label", isSummary
    ? `${KitchenStore.current.name} 各站周盤整店總表`
    : isProduce
      ? `${KitchenStore.current.name} 下午冷藏蔬菜盤點`
      : `${KitchenStore.current.name} ${STATIONS[activeStation].label} 週盤點`);
  prepSyncSection.hidden = isSummary || isProduce;
  itemSettingsButton.hidden = isSummary;
  setTableHead(isSummary ? "summary" : isProduce ? "produce" : "station");
  saveState.textContent = "已載入";
  renderItems();
});

try {
  renderItems();
  if (!inventoryBody.querySelector("tr") && STATIONS[activeStation]?.items?.length) {
    throw new Error(`Cold 內建品項 ${STATIONS[activeStation].items.length} 項，但畫面列數為 0`);
  }
} catch (error) {
  console.error("Weekly 初始載入失敗", error);
  const msg = document.createElement("div");
  msg.style.cssText = "margin:16px;padding:14px;border:2px solid #b42318;border-radius:12px;background:#fff3f2;color:#7a271a;font-weight:700";
  msg.textContent = `週盤載入錯誤：${error?.message || error}`;
  inventoryBody.parentElement?.parentElement?.prepend(msg);
}
["cold", "s1", "s2", "pizza", "produce"].forEach(startWeeklyRealtime);
setTableHead("station");
inventoryDate.value = dateKey();
loadPrepButton.addEventListener("click", loadPrepInventory);
inventoryDate.addEventListener("change", async () => {
  restartWeeklyRealtimeForDate();
  inventory = loadInventory(activeStation);
  renderItems();
  await loadPrepInventory();
});
itemSettingsButton.addEventListener("click", () => {
  if (activeStation === "summary") return alert("請先選擇工作站或下午蔬菜。");
  if (activeStation === "produce") {
    KitchenItemSettings.openManager(
      "weekly",
      "produce",
      BASE_AFTERNOON_PRODUCE_ITEMS,
      () => location.reload(),
    );
    return;
  }
  KitchenItemSettings.openManager("weekly", activeStation, BASE_STATION_ITEMS[activeStation], () => location.reload());
});

// 進入 Weekly 時立即以今天的備料存檔重新同步。
// 沒有當日存檔時，loadPrepInventory 仍會清除前一次留下的備料回推值，
// 因此使用者不需要再手動按「抓取並換算站上庫存」才能歸零。
loadPrepInventory();

</script>
</body>
</html>
