<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>品項與排序設定｜Kitchen OS</title><script src="store-context.js?v=20260805-multistore-v1"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyCFTPiF6H-mpu3-hiUFDZv0okkQxv9PH1g",authDomain:"kitchen-os-fad49.firebaseapp.com",projectId:"kitchen-os-fad49",storageBucket:"kitchen-os-fad49.firebasestorage.app",messagingSenderId:"663452568096",appId:"1:663452568096:web:8a9c5a8d96d8a205918a45"};if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);</script><script src="item-settings.js?v=20260822-cloud-v2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f2;color:#17211d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.back{color:#285842;text-decoration:none;font-weight:800}h1{margin:14px 0 5px}.lead{color:#65706a;margin:0 0 18px}.controls,.add,.list{background:#fff;border:1px solid #dce2dd;border-radius:16px;padding:14px;margin-bottom:14px}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}.controls select,.add input,.add select{width:100%;height:42px;border:1px solid #cbd3ce;border-radius:9px;padding:0 9px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#173b2f;color:#fff}.soft{background:#e8ede9;color:#263b32}.danger{color:#9d2424;background:#fff0f0}.add-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:9px}.add h2{font-size:17px;margin:0 0 10px}.hint{font-size:12px;color:#6d7772;line-height:1.5}.row{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:9px;align-items:center;border-bottom:1px solid #edf0ee;padding:10px 3px}.row:last-child{border:0}.handle{cursor:grab;font-size:20px;color:#718078}.name{font-weight:750}.sub{font-size:12px;color:#748079;margin-top:3px}.row[draggable=true].dragging{opacity:.35}.status{position:sticky;bottom:12px;background:#173b2f;color:#fff;border-radius:12px;padding:11px;text-align:center;display:none}@media(max-width:650px){.controls,.add-grid{grid-template-columns:1fr}.row{grid-template-columns:auto 1fr auto}.row .copy{display:none}}
</style></head><body><main class="wrap"><a class="back" href="index.html">‹ 回首頁</a><h1>品項與排序設定</h1><p class="lead">目前店鋪：<b id="store"></b>。各店設定互不影響；拖曳品項即可改變盤點順序。</p><section class="controls"><select id="type"><option value="weekly">周盤表</option><option value="central">每日央廚盤點表</option></select><select id="station"><option value="s1">S1</option><option value="s2">S2</option><option value="pizza">Pizza</option><option value="cold">Cold</option></select><button class="btn soft" id="reset">恢復原始排序</button></section><section class="add"><h2>新增品項</h2><div class="add-grid"><input id="name" placeholder="品項名稱"><input id="unit" placeholder="單位，例如 Bag / 袋"><select id="location"><option>冷凍</option><option>冷藏</option><option>乾貨</option></select><input id="pack" type="number" min="0" step="any" placeholder="每包克數（選填）"></div><p class="hint">一般品項可直接新增。填寫「每包克數」後，周盤站上輸入 g 會自動換算成包；複雜的多原料備料配方仍建議由公式設定處理。</p><button class="btn primary" id="add">新增到最下方</button></section><section class="list" id="list"></section><div class="status" id="status">設定已儲存</div></main><script>
const $=id=>document.getElementById(id), type=$('type'),station=$('station'),list=$('list');$('store').textContent=KitchenStore.current.name;
function baseItems(){if(type.value==='weekly'&&window.opener?.STATIONS)return window.opener.STATIONS[station.value].items;return []}
function cfg(){return KitchenItemSettings.get(type.value,station.value)}
function label(item){return type.value==='weekly'?{name:item.name,unit:item.unit,id:item._customId}:{name:item[0],unit:item[1],id:item[6]}}
function showSaved(){const s=$('status');s.style.display='block';clearTimeout(showSaved.t);showSaved.t=setTimeout(()=>s.style.display='none',1200)}
function render(){const c=cfg(),items=c.custom||[];list.innerHTML=items.length?'':'<p class="hint">這裡會列出你自行新增的品項。原有品項可在盤點畫面旁的「排序設定」開啟後拖曳；目前版本也提供新增品項的上下排序。</p>';items.forEach((item,i)=>{const x=label(item),r=document.createElement('div');r.className='row';r.draggable=true;r.dataset.i=i;r.innerHTML=`<span class="handle">☰</span><div><div class="name">${x.name}</div><div class="sub">${x.unit||'未設定單位'}・${item.location||'未分類'}</div></div><button class="btn soft copy">複製</button><button class="btn soft up">↑</button><button class="btn danger hide">停用</button>`;r.querySelector('.copy').onclick=()=>{const copy=JSON.parse(JSON.stringify(item));copy._customId='custom:'+Date.now();if(type.value==='weekly')copy.name+='（複製）';else copy[0]+='（複製）';c.custom.splice(i+1,0,copy);KitchenItemSettings.set(type.value,station.value,c);render();showSaved()};r.querySelector('.up').onclick=()=>{if(i){[c.custom[i-1],c.custom[i]]=[c.custom[i],c.custom[i-1]];KitchenItemSettings.set(type.value,station.value,c);render();showSaved()}};r.querySelector('.hide').onclick=()=>{if(confirm('停用此品項？舊盤點紀錄會保留。')){c.custom.splice(i,1);KitchenItemSettings.set(type.value,station.value,c);render();showSaved()}};list.append(r)});}
$('add').onclick=()=>{const name=$('name').value.trim(),unit=$('unit').value.trim();if(!name)return alert('請輸入品項名稱');const c=cfg(),id='custom:'+Date.now(),loc=$('location').value,pack=Number($('pack').value)||0;if(type.value==='weekly'){const order='c'+Date.now();c.custom.push({_customId:id,order,code:'',name,unit,location:loc,customPackGrams:pack})}else c.custom.push([name,unit,loc,null,0,'自訂',id]);KitchenItemSettings.set(type.value,station.value,c);$('name').value='';$('unit').value='';$('pack').value='';render();showSaved()};
$('reset').onclick=()=>{if(!confirm('要恢復此表的原始排序與顯示狀態嗎？自行新增品項會保留。'))return;const c=cfg();c.order=[];c.hidden=[];KitchenItemSettings.set(type.value,station.value,c);render();showSaved()};type.onchange=render;station.onchange=render;(async()=>{await KitchenItemSettings.configureCloud(firebase.firestore());render()})();
</script></body></html>
